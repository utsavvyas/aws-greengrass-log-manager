[package]
name = "gg-log-manager"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "gg-log-manager"
path = "src/main.rs"

[dependencies]
aws-greengrass-component-sdk = "1.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
strip = true
lto = true
opt-level = "z"
